<!-- ❓ Question 1C: ID Selector

👉 Create a webpage with:

One heading
One button

Apply CSS using an ID selector:

Heading color → purple
Button background → black
Button text color → white -->
<html>
    <head>
        <title>I'd Selector</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1 id="one">Heading One</h1>
        <button id="bu">Submit</button>
        
    </body>
</html>

--------------------------------------------------------

CSS

#one
{
    color:purple
}
#bu
{
    background-color: black;
    color: white;
}
